name: Validate website
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-20
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-20
        with:
          node-version: '24'
      - name: Verify immutable assets and HTML references
        run: |
          node scripts/test-version-assets.cjs
          node --test scripts/performance-contract.test.cjs
          node scripts/version-assets.cjs --check
      - name: Verify consent and receiver failure gates without network
        run: |
          node --test integrations/advertising/consent.test.cjs integrations/google-apps-script/*.test.cjs integrations/cloudflare-mailbox/test/*.test.mjs
      - name: Verify public artifact boundary and prepared browser headers
        run: |
          node --test scripts/public-artifact.test.cjs scripts/approved-release.test.cjs integrations/cloudflare-cache/security-policy.test.cjs
          node integrations/cloudflare-cache/security-policy.cjs --check
      - name: Prepare allowlisted public artifact
        run: node scripts/public-artifact.cjs _site
